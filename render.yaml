# NB: the database lives on Supabase (see ANDROID.md), NOT on Render. Do not add a
# Render-managed `databases:` block here — Render's free Postgres is deleted ~30 days
# after creation. DATABASE_URL is set manually in the dashboard to the Supabase pooled URL.

services:
  # ── Backend API ────────────────────────────────────────────────
  - type: web
    name: leyble-hub-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && node db/migrate.js
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set in the Render dashboard to the Supabase POOLED connection string.
      # The buildCommand above runs `node db/migrate.js` against this on every deploy,
      # so the schema can never fall behind the deployed code again.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_ORIGIN
        fromService:
          name: leyble-hub-client
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # ── Frontend Static Site ───────────────────────────────────────
  - type: web
    name: leyble-hub-client
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: leyble-hub-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
