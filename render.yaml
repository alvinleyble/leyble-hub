# NB: the database lives on Supabase (see ANDROID.md), NOT on Render. Do not add a
# Render-managed `databases:` block here — Render's free Postgres is deleted ~30 days
# after creation. DATABASE_URL is set manually in the dashboard to the Supabase pooled URL.

services:
  # ── Backend API + built frontend (single service) ───────────────
  # No rootDir: the build needs both server/ and client/, and Render's
  # rootDir excludes everything outside it. The server serves
  # client/dist at the same origin so the SameSite=Strict login cookie
  # works for browser/PWA clients (a separate static-site origin would
  # be cross-site under the onrender.com Public Suffix List entry).
  - type: web
    name: leyble-hub-api
    env: node
    plan: free
    # `--include=dev` for the client install: NODE_ENV=production (set below for the
    # running server) makes npm skip devDependencies by default, but vite and the
    # Tailwind/PostCSS toolchain (needed to build client/dist) live there.
    buildCommand: >
      npm --prefix server install &&
      npm --prefix client install --include=dev &&
      npm --prefix client run build &&
      node server/db/migrate.js
    startCommand: node server/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set in the Render dashboard to the Supabase POOLED connection string.
      # The buildCommand above runs `node db/migrate.js` against this on every deploy,
      # so the schema can never fall behind the deployed code again.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Optional: extra browser origins (comma-separated), e.g. for the
      # Vite dev server during local testing against this deployment.
      - key: CLIENT_ORIGIN
        sync: false
