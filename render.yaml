# NB: the database lives on Supabase (see docs/operations/android.md), NOT on Render.
# Do not add a Render-managed `databases:` block here — Render's free Postgres is deleted
# ~30 days after creation. DATABASE_URL is set manually in the dashboard per environment
# to the Supabase pooled URL.

projects:
  - name: leyble-hub
    environments:
      # ──────────────────────────────────────────────────────────────
      # STAGING: deploys from staging branch
      # ──────────────────────────────────────────────────────────────
      - name: staging
        services:
          - type: web
            name: leyble-hub-api
            env: node
            plan: free
            branch: staging
            # API-only service for the Android APK — the server no longer builds or
            # serves the web client, so only the server package is installed. The APK's
            # own web assets are built locally via `cap sync`, not here.
            buildCommand: >
              npm --prefix server install &&
              node server/db/migrate.js
            startCommand: node server/src/index.js
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              # Set in the Render dashboard to the Tokyo Development Supabase POOLED
              # connection string (ref yzopwoquzfnyqdmuookw). The buildCommand above
              # runs `node db/migrate.js` against this on every deploy, so the schema
              # can never fall behind the deployed code.
              - key: DATABASE_URL
                sync: false
              - key: JWT_SECRET
                generateValue: true
              # Intentionally no JWT_EXPIRES_IN — sessions never expire (single shared
              # login on a couple of Android devices; see server/src/routes/auth.js).
              # Set in the Render dashboard to `http://localhost` — lets a debug Android
              # build (androidScheme: "http", e2e/appium's on-device/Appium tests) reach
              # this staging API. NODE_ENV=production above means DEV_CORS_EXTRA_ORIGINS
              # never applies here, so this is a separate, staging-only extension point
              # (server/src/index.js) — never set this on the production service.
              - key: STAGING_CORS_EXTRA_ORIGINS
                sync: false
