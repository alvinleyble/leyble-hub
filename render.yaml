# NB: the database lives on Supabase (see docs/operations/android.md), NOT on Render.
# Do not add a Render-managed `databases:` block here — Render's free Postgres is deleted
# ~30 days after creation. DATABASE_URL is set manually in the dashboard per environment
# to the Supabase pooled URL.

projects:
  - name: leyble-hub
    environments:
      # ──────────────────────────────────────────────────────────────
      # PRODUCTION: deploys from main branch
      # ──────────────────────────────────────────────────────────────
      - name: production
        services:
          - type: web
            name: leyble-hub-api
            env: node
            plan: free
            branch: main
            # API-only service for the Android APK — the server no longer builds or
            # serves the web client, so only the server package is installed. The APK's
            # own web assets are built locally via `cap sync`, not here.
            buildCommand: >
              npm --prefix server install &&
              node server/db/migrate.js
            startCommand: node server/src/index.js
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              # Set in the Render dashboard to the prod Supabase POOLED connection string.
              # The buildCommand above runs `node db/migrate.js` against this on every
              # deploy, so the schema can never fall behind the deployed code.
              - key: DATABASE_URL
                sync: false
              - key: JWT_SECRET
                generateValue: true
              # Intentionally no JWT_EXPIRES_IN — sessions never expire (single shared
              # login on a couple of Android devices; see server/src/routes/auth.js).
