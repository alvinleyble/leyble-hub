name: CI

on:
  pull_request:
    branches:
      - main
      - staging
      - 'v*'
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  client:
    name: Client Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build web client
        working-directory: client
        run: npm run build

  server:
    name: Server Syntax & Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Validate JavaScript syntax
        run: find server/src server/db -name "*.js" -exec node --check {} +
