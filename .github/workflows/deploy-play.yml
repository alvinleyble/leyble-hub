name: Deploy to Play Internal

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-play.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps & build web
        working-directory: client
        run: |
          npm ci
          npm run build
        env:
          VITE_V25_OFFLINE_CORE: on

      - name: Capacitor sync
        working-directory: client
        run: npx cap sync android

      - name: Decode keystore
        run: echo "$PLAY_KEYSTORE_BASE64" | base64 -d > client/android/app/release.jks
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}

      - name: Build AAB
        working-directory: client/android
        run: ./gradlew bundleRelease --stacktrace
        env:
          PLAY_KEYSTORE_PATH: release.jks
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}

      - name: Upload to Play Internal
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.leyble.hub
          releaseFiles: client/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
